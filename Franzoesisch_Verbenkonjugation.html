<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>La Course de Paris — Verben-Rallye</title>
<style>
  :root{
    --blue:#274b8f; --blue-dark:#1b3565; --red:#c8102e; --gold:#f2b134;
    --green:#1e8a5f; --bg:#f4f6fb; --card:#ffffff; --text:#1c2430; --muted:#5b6675;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  button{ font-family:inherit; touch-action:manipulation; cursor:pointer; }
  header{ padding:18px 16px 10px; text-align:center; background:linear-gradient(180deg,var(--blue),var(--blue-dark)); color:#fff; }
  header h1{ margin:0 0 4px; font-size:1.5rem; }
  header .subtitle{ font-size:0.85rem; opacity:0.85; margin-bottom:8px; }
  header .leitspruch{ font-style:italic; font-size:1rem; background:rgba(255,255,255,0.12); display:inline-block;
    padding:6px 14px; border-radius:999px; }
  .mute-btn{ position:absolute; top:14px; right:14px; background:rgba(255,255,255,0.15); color:#fff; border:none;
    border-radius:10px; min-width:44px; min-height:44px; font-size:1.2rem; }
  main{ position:relative; max-width:780px; margin:0 auto; padding:16px; padding-bottom:70px; }
  footer{ text-align:center; font-size:0.8rem; color:var(--muted); padding:14px; }

  .card{ background:var(--card); border-radius:16px; padding:18px; box-shadow:0 2px 10px rgba(20,30,60,0.08); margin-bottom:16px; }

  .mode-choice{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:14px 0; }
  .mode-btn{ border:2px solid #dfe4ee; background:#fff; border-radius:14px; padding:16px 10px; min-height:78px;
    font-size:1rem; font-weight:600; color:var(--text); }
  .mode-btn.selected{ border-color:var(--blue); background:#eaf0ff; color:var(--blue-dark); }

  .big-btn{ display:block; width:100%; min-height:52px; border:none; border-radius:12px; background:var(--blue);
    color:#fff; font-size:1.05rem; font-weight:700; margin-top:8px; }
  .big-btn:active{ transform:scale(0.98); }
  .big-btn.secondary{ background:var(--green); }

  details summary{ cursor:pointer; font-weight:600; color:var(--blue-dark); padding:6px 0; }
  details p{ color:var(--muted); font-size:0.92rem; line-height:1.4; }

  .turn-banner{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .turn-banner .who{ font-weight:700; }
  .turn-banner .who.a{ color:var(--blue); }
  .turn-banner .who.b{ color:var(--red); }
  .stars{ font-weight:600; color:var(--gold); }

  .board{ display:grid; grid-template-columns:repeat(6,1fr); grid-template-rows:repeat(4,1fr);
    gap:5px; aspect-ratio:6/4; max-width:720px; margin:0 auto 16px; }
  .square{ position:relative; background:#fff; border:2px solid #e3e8f2; border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:clamp(1rem,3vw,1.5rem); }
  .square.start{ background:#e8f0ff; }
  .square.finish{ background:#fff2d6; }
  .square.bonus{ background:#eafaf0; }
  .square .tokens{ position:absolute; bottom:1px; display:flex; gap:2px; font-size:0.7rem; }

  .roll-row{ display:flex; align-items:center; gap:14px; justify-content:center; margin-bottom:6px; }
  .dice{ min-width:64px; min-height:64px; border-radius:14px; background:var(--blue-dark); color:#fff;
    font-size:1.8rem; font-weight:800; border:none; display:flex; align-items:center; justify-content:center; }
  .roll-btn{ min-height:52px; padding:0 22px; border:none; border-radius:12px; background:var(--gold);
    color:var(--blue-dark); font-weight:800; font-size:1.05rem; }
  .roll-btn:disabled{ opacity:0.5; }

  .overlay{ position:fixed; inset:0; background:rgba(15,20,35,0.55); display:flex; align-items:center;
    justify-content:center; padding:16px; z-index:20; }
  .modal{ background:#fff; border-radius:18px; padding:20px; max-width:520px; width:100%; max-height:88vh; overflow:auto; }
  .modal h2{ margin:0 0 4px; font-size:1.05rem; color:var(--muted); }
  .polarity-tag{ display:inline-block; font-weight:700; font-size:0.85rem; padding:5px 12px;
    border-radius:999px; margin-bottom:10px; }
  .polarity-tag.pos{ background:#e6f7ee; color:var(--green); }
  .polarity-tag.neg{ background:#fdeaec; color:var(--red); }
  .modal .sentence{ font-size:1.25rem; font-weight:700; margin:10px 0 16px; line-height:1.4; }
  .options{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .opt-btn{ min-height:56px; border:2px solid #dfe4ee; border-radius:12px; background:#fff; font-size:1rem;
    padding:8px; word-break:break-word; }
  .opt-btn.correct{ border-color:var(--green); background:#e6f7ee; }
  .opt-btn.wrong{ border-color:var(--red); background:#fdeaec; }
  .opt-btn:disabled{ opacity:0.85; }
  .explanation{ margin-top:14px; padding:12px; background:#f4f6fb; border-radius:10px; font-size:0.92rem; line-height:1.45; }
  .result-icon{ font-size:1.1rem; margin-right:6px; }

  .fact-box{ font-size:1.1rem; line-height:1.5; margin:12px 0 18px; }

  .finish-screen h2{ color:var(--blue-dark); }
  .finish-stats{ font-size:1.1rem; margin:10px 0; }

  @media (max-width:420px){
    .options{ grid-template-columns:1fr; }
    .mode-choice{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header>
  <button class="mute-btn" id="muteBtn" aria-label="Ton stumm schalten">🔊</button>
  <h1>🗼 La Course de Paris</h1>
  <div class="subtitle">Verben-Rallye: avoir · être · faire · aller · devoir · pouvoir · vouloir</div>
  <div class="leitspruch">« Chaque verbe conjugué te rapproche de la tour Eiffel ! »</div>
</header>

<main id="main"></main>

<footer>Créé par Fabian Castrischer</footer>

<script>
const VERBS = [
  { id:"avoir", label:"avoir",
    objAff:"un chien", objNeg:"de chien",
    forms:{
      tu:{ pA:"as", pN:"n'as pas", fA:"vas avoir", fN:"ne vas pas avoir", cA:"as eu", cN:"n'as pas eu" },
      il:{ pA:"a", pN:"n'a pas", fA:"va avoir", fN:"ne va pas avoir", cA:"a eu", cN:"n'a pas eu" },
      elle:{ pA:"a", pN:"n'a pas", fA:"va avoir", fN:"ne va pas avoir", cA:"a eu", cN:"n'a pas eu" },
      nous:{ pA:"avons", pN:"n'avons pas", fA:"allons avoir", fN:"n'allons pas avoir", cA:"avons eu", cN:"n'avons pas eu" },
      vous:{ pA:"avez", pN:"n'avez pas", fA:"allez avoir", fN:"n'allez pas avoir", cA:"avez eu", cN:"n'avez pas eu" },
      ils:{ pA:"ont", pN:"n'ont pas", fA:"vont avoir", fN:"ne vont pas avoir", cA:"ont eu", cN:"n'ont pas eu" }
    }
  },
  { id:"etre", label:"être",
    objAff:"en retard", objNeg:"en retard",
    forms:{
      tu:{ pA:"es", pN:"n'es pas", fA:"vas être", fN:"ne vas pas être", cA:"as été", cN:"n'as pas été" },
      il:{ pA:"est", pN:"n'est pas", fA:"va être", fN:"ne va pas être", cA:"a été", cN:"n'a pas été" },
      elle:{ pA:"est", pN:"n'est pas", fA:"va être", fN:"ne va pas être", cA:"a été", cN:"n'a pas été" },
      nous:{ pA:"sommes", pN:"ne sommes pas", fA:"allons être", fN:"n'allons pas être", cA:"avons été", cN:"n'avons pas été" },
      vous:{ pA:"êtes", pN:"n'êtes pas", fA:"allez être", fN:"n'allez pas être", cA:"avez été", cN:"n'avez pas été" },
      ils:{ pA:"sont", pN:"ne sont pas", fA:"vont être", fN:"ne vont pas être", cA:"ont été", cN:"n'ont pas été" }
    }
  },
  { id:"faire", label:"faire",
    objAff:"la vaisselle", objNeg:"la vaisselle",
    forms:{
      tu:{ pA:"fais", pN:"ne fais pas", fA:"vas faire", fN:"ne vas pas faire", cA:"as fait", cN:"n'as pas fait" },
      il:{ pA:"fait", pN:"ne fait pas", fA:"va faire", fN:"ne va pas faire", cA:"a fait", cN:"n'a pas fait" },
      elle:{ pA:"fait", pN:"ne fait pas", fA:"va faire", fN:"ne va pas faire", cA:"a fait", cN:"n'a pas fait" },
      nous:{ pA:"faisons", pN:"ne faisons pas", fA:"allons faire", fN:"n'allons pas faire", cA:"avons fait", cN:"n'avons pas fait" },
      vous:{ pA:"faites", pN:"ne faites pas", fA:"allez faire", fN:"n'allez pas faire", cA:"avez fait", cN:"n'avez pas fait" },
      ils:{ pA:"font", pN:"ne font pas", fA:"vont faire", fN:"ne vont pas faire", cA:"ont fait", cN:"n'ont pas fait" }
    }
  },
  { id:"aller", label:"aller",
    objAff:"au cinéma", objNeg:"au cinéma",
    forms:{
      tu:{ pA:"vas", pN:"ne vas pas", fA:"vas aller", fN:"ne vas pas aller", cA:"es allé(e)", cN:"n'es pas allé(e)" },
      il:{ pA:"va", pN:"ne va pas", fA:"va aller", fN:"ne va pas aller", cA:"est allé", cN:"n'est pas allé" },
      elle:{ pA:"va", pN:"ne va pas", fA:"va aller", fN:"ne va pas aller", cA:"est allée", cN:"n'est pas allée" },
      nous:{ pA:"allons", pN:"n'allons pas", fA:"allons aller", fN:"n'allons pas aller", cA:"sommes allé(e)s", cN:"ne sommes pas allé(e)s" },
      vous:{ pA:"allez", pN:"n'allez pas", fA:"allez aller", fN:"n'allez pas aller", cA:"êtes allé(e)(s)", cN:"n'êtes pas allé(e)(s)" },
      ils:{ pA:"vont", pN:"ne vont pas", fA:"vont aller", fN:"ne vont pas aller", cA:"sont allés", cN:"ne sont pas allés" }
    }
  },
  { id:"devoir", label:"devoir",
    objAff:"partir tôt", objNeg:"partir tôt",
    forms:{
      tu:{ pA:"dois", pN:"ne dois pas", fA:"vas devoir", fN:"ne vas pas devoir", cA:"as dû", cN:"n'as pas dû" },
      il:{ pA:"doit", pN:"ne doit pas", fA:"va devoir", fN:"ne va pas devoir", cA:"a dû", cN:"n'a pas dû" },
      elle:{ pA:"doit", pN:"ne doit pas", fA:"va devoir", fN:"ne va pas devoir", cA:"a dû", cN:"n'a pas dû" },
      nous:{ pA:"devons", pN:"ne devons pas", fA:"allons devoir", fN:"n'allons pas devoir", cA:"avons dû", cN:"n'avons pas dû" },
      vous:{ pA:"devez", pN:"ne devez pas", fA:"allez devoir", fN:"n'allez pas devoir", cA:"avez dû", cN:"n'avez pas dû" },
      ils:{ pA:"doivent", pN:"ne doivent pas", fA:"vont devoir", fN:"ne vont pas devoir", cA:"ont dû", cN:"n'ont pas dû" }
    }
  },
  { id:"pouvoir", label:"pouvoir",
    objAff:"venir à la fête", objNeg:"venir à la fête",
    forms:{
      tu:{ pA:"peux", pN:"ne peux pas", fA:"vas pouvoir", fN:"ne vas pas pouvoir", cA:"as pu", cN:"n'as pas pu" },
      il:{ pA:"peut", pN:"ne peut pas", fA:"va pouvoir", fN:"ne va pas pouvoir", cA:"a pu", cN:"n'a pas pu" },
      elle:{ pA:"peut", pN:"ne peut pas", fA:"va pouvoir", fN:"ne va pas pouvoir", cA:"a pu", cN:"n'a pas pu" },
      nous:{ pA:"pouvons", pN:"ne pouvons pas", fA:"allons pouvoir", fN:"n'allons pas pouvoir", cA:"avons pu", cN:"n'avons pas pu" },
      vous:{ pA:"pouvez", pN:"ne pouvez pas", fA:"allez pouvoir", fN:"n'allez pas pouvoir", cA:"avez pu", cN:"n'avez pas pu" },
      ils:{ pA:"peuvent", pN:"ne peuvent pas", fA:"vont pouvoir", fN:"ne vont pas pouvoir", cA:"ont pu", cN:"n'ont pas pu" }
    }
  },
  { id:"vouloir", label:"vouloir",
    objAff:"une pizza", objNeg:"de pizza",
    forms:{
      tu:{ pA:"veux", pN:"ne veux pas", fA:"vas vouloir", fN:"ne vas pas vouloir", cA:"as voulu", cN:"n'as pas voulu" },
      il:{ pA:"veut", pN:"ne veut pas", fA:"va vouloir", fN:"ne va pas vouloir", cA:"a voulu", cN:"n'a pas voulu" },
      elle:{ pA:"veut", pN:"ne veut pas", fA:"va vouloir", fN:"ne va pas vouloir", cA:"a voulu", cN:"n'a pas voulu" },
      nous:{ pA:"voulons", pN:"ne voulons pas", fA:"allons vouloir", fN:"n'allons pas vouloir", cA:"avons voulu", cN:"n'avons pas voulu" },
      vous:{ pA:"voulez", pN:"ne voulez pas", fA:"allez vouloir", fN:"n'allez pas vouloir", cA:"avez voulu", cN:"n'avez pas voulu" },
      ils:{ pA:"veulent", pN:"ne veulent pas", fA:"vont vouloir", fN:"ne vont pas vouloir", cA:"ont voulu", cN:"n'ont pas voulu" }
    }
  }
];

const ROTATION = {
  avoir:{ pA:"tu", pN:"il", fA:"elle", fN:"nous", cA:"vous", cN:"ils" },
  etre:{ pA:"il", pN:"elle", fA:"nous", fN:"vous", cA:"ils", cN:"tu" },
  faire:{ pA:"elle", pN:"nous", fA:"vous", fN:"ils", cA:"tu", cN:"il" },
  aller:{ pA:"nous", pN:"vous", fA:"ils", fN:"tu", cA:"il", cN:"elle" },
  devoir:{ pA:"vous", pN:"ils", fA:"tu", fN:"il", cA:"elle", cN:"nous" },
  pouvoir:{ pA:"ils", pN:"tu", fA:"il", fN:"elle", cA:"nous", cN:"vous" },
  vouloir:{ pA:"tu", pN:"il", fA:"elle", fN:"nous", cA:"vous", cN:"ils" }
};

const DISTRACTOR_MAP = {
  pA:["pN","fA","cA"], pN:["pA","fN","cN"],
  fA:["fN","pA","cA"], fN:["fA","pN","cN"],
  cA:["cN","pA","fA"], cN:["cA","pN","fN"]
};

const TIME_MARKER = { pA:"En ce moment,", pN:"En ce moment,", fA:"Demain,", fN:"Demain,", cA:"Hier,", cN:"Hier," };
const TENSE_LABEL = {
  pA:"Présent (affirmativ)", pN:"Présent (négativ)",
  fA:"Futur proche (affirmativ)", fN:"Futur proche (négativ)",
  cA:"Passé composé (affirmativ)", cN:"Passé composé (négativ)"
};
const TENSE_TIP = {
  pA:"Présent: die konjugierte Verbform direkt nach dem Subjekt.",
  pN:"Verneinung im Présent: ne...pas umschliesst das konjugierte Verb.",
  fA:"Futur proche: aller (konjugiert) + Infinitiv.",
  fN:"Verneinung im Futur proche: ne...pas umschliesst 'aller', der Infinitiv bleibt danach stehen.",
  cA:"Passé composé: Hilfsverb (avoir oder être) + Partizip Perfekt.",
  cN:"Verneinung im Passé composé: ne...pas umschliesst das Hilfsverb, das Partizip bleibt danach stehen."
};

function objectFor(verb, combo){ return combo.endsWith("N") ? verb.objNeg : verb.objAff; }

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuestionBank(){
  const bank = [];
  VERBS.forEach(verb=>{
    const rotation = ROTATION[verb.id];
    Object.keys(rotation).forEach(combo=>{
      const pronoun = rotation[combo];
      const correct = verb.forms[pronoun][combo];
      const object = objectFor(verb, combo);
      const distractors = DISTRACTOR_MAP[combo].map(dc=>verb.forms[pronoun][dc]);
      const options = shuffle([correct, ...distractors]);
      const negative = combo.endsWith("N");
      bank.push({
        prefix: TIME_MARKER[combo],
        subject: pronoun,
        object,
        correct,
        options,
        negative,
        explanation: `${verb.label} — ${TENSE_LABEL[combo]}: „${pronoun} ${correct} ${object}.“ ${TENSE_TIP[combo]}`
      });
    });
  });
  return shuffle(bank);
}

const BOARD_LAST = 23;
const BONUS_INDICES = [4,8,12,16,20];
const PARIS_FACTS = [
  "La tour Eiffel mesure 330 mètres de haut.",
  "Le Louvre est le plus grand musée du monde.",
  "Notre-Dame est une cathédrale sur une île, au centre de Paris.",
  "La Seine traverse Paris et passe sous 37 ponts.",
  "L'Arc de Triomphe se trouve sur les Champs-Élysées."
];
const ROUTE_ICONS = ["🚕","🥐","🎈","🛍️","🚦"];

function buildSquares(){
  const bank = buildQuestionBank();
  let qi = 0;
  const squares = [];
  for(let i=0;i<=BOARD_LAST;i++){
    if(i===0) squares.push({type:"start"});
    else if(i===BOARD_LAST) squares.push({type:"finish"});
    else if(BONUS_INDICES.includes(i)) squares.push({type:"bonus", fact:PARIS_FACTS[BONUS_INDICES.indexOf(i)]});
    else squares.push({type:"question", q:bank[qi++]});
  }
  return squares;
}

function iconFor(i, sq){
  if(i===0) return "🚉";
  if(i===BOARD_LAST) return "🗼";
  if(sq.type==="bonus") return "⭐";
  return ROUTE_ICONS[i % ROUTE_ICONS.length];
}

function gridPos(i){
  const row = Math.floor(i/6);
  const colInRow = i % 6;
  const col = row % 2 === 0 ? colInRow : 5 - colInRow;
  return { gridRow: 4 - row, gridColumn: col + 1 };
}

let state = null;
let muted = false;

function newState(numPlayers){
  return {
    numPlayers,
    squares: buildSquares(),
    players: numPlayers === 1
      ? [{ name:"Toi", color:"a", pos:0, stars:0, answered:0 }]
      : [{ name:"Équipe Bleue", color:"a", pos:0, stars:0, answered:0 },
         { name:"Équipe Rouge", color:"b", pos:0, stars:0, answered:0 }],
    current:0,
    phase:"playing",
    busy:false,
    winnerIndex:null
  };
}

let audioCtx = null;
function beep(freqs, dur){
  if(muted) return;
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, idx)=>{
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.frequency.value = f;
      osc.type = "sine";
      gain.gain.value = 0.08;
      osc.connect(gain).connect(audioCtx.destination);
      const start = audioCtx.currentTime + idx*dur;
      osc.start(start);
      gain.gain.setValueAtTime(0.08, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start+dur);
      osc.stop(start+dur);
    });
  }catch(e){}
}
function playCorrect(){ beep([523,659,784], 0.13); }
function playWrong(){ beep([220], 0.22); }

const main = document.getElementById("main");

function renderStart(){
  main.innerHTML = `
    <div class="card">
      <h2 style="margin-top:0;">Bienvenue !</h2>
      <p>Konjugiere <strong>avoir, être, faire, aller, devoir, pouvoir, vouloir</strong> im
      Présent, Futur proche und Passé composé — affirmativ und négativ, jeweils mit einem Objekt —
      und reise per Würfel bis zur tour Eiffel.</p>
      <details>
        <summary>Wie spielt man?</summary>
        <p>Würfle und bewege deine Figur über den Parcours. Auf einem Frage-Feld wählst du die
        richtige Verbform aus vier Möglichkeiten. Auf einem ⭐-Feld gibt es ein kleines Paris-Fakt
        zur Erholung. Wer zuerst die tour Eiffel erreicht, gewinnt.</p>
      </details>
      <div class="mode-choice">
        <button class="mode-btn selected" data-mode="1">🙋 1 Spieler(in)</button>
        <button class="mode-btn" data-mode="2">🤝 2 Teams (ein iPad)</button>
      </div>
      <button class="big-btn" id="startBtn">Spiel starten</button>
    </div>
  `;
  let mode = 1;
  main.querySelectorAll(".mode-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      mode = parseInt(btn.dataset.mode, 10);
      main.querySelectorAll(".mode-btn").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
    });
  });
  document.getElementById("startBtn").addEventListener("click", ()=>{
    state = newState(mode);
    renderGame();
  });
}

function renderGame(){
  const player = state.players[state.current];
  main.innerHTML = `
    <div class="turn-banner">
      <div class="who ${player.color}">${state.numPlayers===2 ? "Am Zug: "+player.name : "Deine Runde"}</div>
      <div class="stars">⭐ ${state.players.map(p=>p.stars).join(state.numPlayers===2 ? " : " : "")}</div>
    </div>
    <div class="board" id="board"></div>
    <div class="roll-row">
      <div class="dice" id="dice">?</div>
      <button class="roll-btn" id="rollBtn">Würfeln 🎲</button>
    </div>
  `;
  renderBoard();
  document.getElementById("rollBtn").addEventListener("click", handleRoll);
}

function renderBoard(){
  const board = document.getElementById("board");
  board.innerHTML = "";
  state.squares.forEach((sq, i)=>{
    const pos = gridPos(i);
    const div = document.createElement("div");
    div.className = "square " + sq.type;
    div.style.gridRow = pos.gridRow;
    div.style.gridColumn = pos.gridColumn;
    div.textContent = iconFor(i, sq);
    const tokens = document.createElement("div");
    tokens.className = "tokens";
    state.players.forEach(p=>{
      if(p.pos === i) tokens.textContent += (p.color==="a" ? "🔵" : "🔴");
    });
    div.appendChild(tokens);
    board.appendChild(div);
  });
}

function handleRoll(){
  if(state.busy) return;
  state.busy = true;
  document.getElementById("rollBtn").disabled = true;
  const diceEl = document.getElementById("dice");
  let ticks = 0;
  const spin = setInterval(()=>{
    diceEl.textContent = String(1 + Math.floor(Math.random()*6));
    ticks++;
    if(ticks > 8){
      clearInterval(spin);
      const roll = 1 + Math.floor(Math.random()*6);
      diceEl.textContent = String(roll);
      movePlayer(roll);
    }
  }, 70);
}

function movePlayer(roll){
  const player = state.players[state.current];
  player.pos = Math.min(player.pos + roll, BOARD_LAST);
  renderBoard();
  const sq = state.squares[player.pos];
  setTimeout(()=>{
    if(sq.type === "question") showQuestion(sq.q);
    else if(sq.type === "bonus") showBonus(sq.fact);
    else if(sq.type === "finish") showFinish();
    else endTurn();
  }, 350);
}

function endTurn(){
  state.busy = false;
  if(state.numPlayers === 2) state.current = (state.current + 1) % 2;
  const btn = document.getElementById("rollBtn");
  if(btn) btn.disabled = false;
  const banner = document.querySelector(".turn-banner .who");
  if(banner){
    const player = state.players[state.current];
    banner.textContent = state.numPlayers===2 ? "Am Zug: "+player.name : "Deine Runde";
    banner.className = "who " + player.color;
  }
  const starsEl = document.querySelector(".stars");
  if(starsEl){
    starsEl.textContent = "⭐ " + state.players.map(p=>p.stars).join(state.numPlayers===2 ? " : " : "");
  }
}

function showBonus(fact){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h2>⭐ Petite pause</h2>
      <div class="fact-box">${fact}</div>
      <button class="big-btn" id="closeBonus">Weiter</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("closeBonus").addEventListener("click", ()=>{
    overlay.remove();
    endTurn();
  });
}

function showQuestion(q){
  const player = state.players[state.current];
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="modal">
      <h2>Complète la phrase</h2>
      <div class="polarity-tag ${q.negative ? "neg" : "pos"}">${q.negative ? "🚫 verneinte Form (négatif)" : "✅ bejahte Form (affirmatif)"}</div>
      <div class="sentence">${q.prefix} ${q.subject} ___ ${q.object}.</div>
      <div class="options">
        ${q.options.map((opt,idx)=>`<button class="opt-btn" data-idx="${idx}">${opt}</button>`).join("")}
      </div>
      <div class="explanation" id="explainBox" style="display:none;"></div>
      <button class="big-btn" id="closeQuestion" style="display:none;">Weiter</button>
    </div>
  `;
  document.body.appendChild(overlay);

  overlay.querySelectorAll(".opt-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const chosen = btn.textContent;
      overlay.querySelectorAll(".opt-btn").forEach(b=>{
        b.disabled = true;
        if(b.textContent === q.correct) b.classList.add("correct");
        else if(b === btn) b.classList.add("wrong");
      });
      const correct = chosen === q.correct;
      if(correct){ player.stars++; playCorrect(); }
      else playWrong();
      player.answered++;
      const explainBox = document.getElementById("explainBox");
      explainBox.style.display = "block";
      explainBox.innerHTML = `<span class="result-icon">${correct ? "✅" : "❌"}</span>${q.explanation}`;
      document.getElementById("closeQuestion").style.display = "block";
    });
  });

  document.getElementById("closeQuestion").addEventListener("click", ()=>{
    overlay.remove();
    if(player.pos === BOARD_LAST) showFinish();
    else endTurn();
  });
}

function showFinish(){
  state.busy = true;
  const player = state.players[state.current];
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  const statsHtml = state.players.map(p=>{
    const pct = p.answered ? Math.round((p.stars/p.answered)*100) : 0;
    return `<div class="finish-stats">${p.name}: ⭐ ${p.stars} / ${p.answered} (${pct}%)</div>`;
  }).join("");
  overlay.innerHTML = `
    <div class="modal finish-screen">
      <h2>🗼 ${player.name} a atteint la tour Eiffel !</h2>
      ${statsHtml}
      <p style="margin-top:14px;">« Chaque verbe conjugué te rapproche de la tour Eiffel ! »</p>
      <p>Bravo, tu progresses vraiment bien en français. Continue comme ça !</p>
      <button class="big-btn secondary" id="playAgain">Nochmal spielen</button>
    </div>
  `;
  document.body.appendChild(overlay);
  document.getElementById("playAgain").addEventListener("click", ()=>{
    overlay.remove();
    state = null;
    renderStart();
  });
}

document.getElementById("muteBtn").addEventListener("click", ()=>{
  muted = !muted;
  document.getElementById("muteBtn").textContent = muted ? "🔇" : "🔊";
});

renderStart();
</script>
</body>
</html>
